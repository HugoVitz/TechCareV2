name: techcare_mobile
description: App do TechCare Soluções (PIM VII) - igual ao painel web - para Android, iOS, web e desktop, com uso offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  intl: '>=0.19.0 <0.21.0'
  flutter_tts: ^4.0.2
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/LogoTC.png
