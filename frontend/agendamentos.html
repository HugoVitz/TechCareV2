<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agendamentos - TechCare Soluções</title>
  <link rel="shortcut icon" href="img/LogoTC.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/status.css">

  <script>
    (function () {
      try {
        const prefs = JSON.parse(localStorage.getItem("tc_preferences") || "{}");

        if (prefs.tema) {
          document.documentElement.dataset.theme = prefs.tema;
        }

        if (prefs.corPrincipal) {
          document.documentElement.style.setProperty("--primary", prefs.corPrincipal);
          document.documentElement.style.setProperty("--primary-2", prefs.corPrincipal);
        }

        if (prefs.fatorFonte) {
          document.documentElement.style.setProperty("--fontScale", prefs.fatorFonte);
        }
      } catch {}
    })();
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="img/icon-192.png">
</head>

<body>
  <script>
    (function () {
      try {
        const prefs = JSON.parse(localStorage.getItem("tc_preferences") || "{}");

        if (prefs.tema) {
          document.body.dataset.theme = prefs.tema;
        }

        if (prefs.compactarTabelas) {
          document.body.dataset.compact = "true";
        }

        if (prefs.altoContraste) {
          document.body.dataset.contrast = "true";
        }
      } catch {}
    })();
  </script>

  <aside class="sidebar">
    <h1>TechCare Soluções</h1>

    <nav>
      <a href="index.html">
        <i data-lucide="layout-dashboard"></i>
        Dashboard
      </a>

      <a href="clientes.html">
        <i data-lucide="users"></i>
        Clientes
      </a>

      <a href="agendamentos.html" class="active">
        <i data-lucide="calendar-days"></i>
        Agendamentos
      </a>

      <a href="servicos.html">
        <i data-lucide="clipboard-list"></i>
        Ordens de Serviço
      </a>

      <a href="cadastro-servicos.html" data-admin-only>
        <i data-lucide="wrench"></i>
        Serviços
      </a>

      <a href="produtos.html" data-admin-only><i data-lucide="package"></i> Produtos</a>

      <a href="financeiro.html" data-admin-only><i data-lucide="wallet"></i> Financeiro</a>

      <a href="historico.html" data-admin-only><i data-lucide="history"></i> Histórico</a>

      <a href="usuarios.html" data-admin-only><i data-lucide="user-cog"></i> Atendentes</a>

      <a href="configuracoes.html">
        <i data-lucide="settings"></i>
        Configurações
      </a>

      <div class="logout">
        <a id="logoutLink" href="login.html">
          <i data-lucide="log-out"></i>
          Sair
        </a>
      </div>
    </nav>
  </aside>

  <main class="content">
    <header class="page-header">
      <h1>Agendamentos</h1>
    </header>

    <section class="panel">
      <h2>Novo Agendamento</h2>

      <form id="agendamentoForm" class="form-grid">

        <input type="hidden" id="id">

        <div>
          <label for="pacienteId">
            Cliente
          </label>

          <select
            id="pacienteId"
            required
            aria-label="Selecionar cliente"
          >
            <option value="">
              Selecione o cliente
            </option>
          </select>
        </div>

        <div>
          <label for="profissionalId">
            Atendente
          </label>

          <select
            id="profissionalId"
            required
            aria-label="Selecionar atendente"
          >
            <option value="">
              Selecione o atendente
            </option>
          </select>
        </div>

        <div>
          <label for="dataHora">
            Data e horário
          </label>

          <input
            type="datetime-local"
            id="dataHora"
            required
            aria-label="Selecionar data e horário"
          >
        </div>

        <div>
          <label for="status">
            Status do atendimento
          </label>

          <select
            id="status"
            required
            aria-label="Selecionar status"
          >
            <option value="">
              Selecione o status
            </option>

            <option value="Agendado">
              Agendado
            </option>

            <option value="Cancelado">
              Cancelado
            </option>

            <option value="Em andamento">
              Em andamento
            </option>

            <option value="Realizado">
              Realizado
            </option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit">
            Salvar
          </button>

          <button
            type="button"
            class="secondary"
            onclick="limparFormulario()"
          >
            Limpar 
          </button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Lista de Agendamentos</h2>
      <p>Veja abaixo os agendamentos já cadastrados no sistema.</p>
      <table aria-label="Tabela de agendamentos">
        <thead>
          <tr>
            <th data-filter-col="0" style="cursor:pointer;">
              ID
            </th>

            <th data-filter-col="1" style="cursor:pointer;">
              Cliente
            </th>

            <th data-filter-col="2" style="cursor:pointer;">
              Atendente
            </th>

            <th data-filter-col="3" style="cursor:pointer;">
              Data e horário
            </th>

            <th data-filter-col="4" style="cursor:pointer;">
              Status
            </th>

            <th>
              Ações
            </th>
          </tr>
        </thead>

        <tbody id="agendamentosTable"></tbody>
      </table>
    </section>
  </main>

  <script src="js/api.js"></script>

  <script type="module">
    import { requireAuth } from "./js/guard.js";
    import { initAppState } from "./js/appState.js";

    await requireAuth();
    await initAppState();
  </script>
<script src="js/formAutosave.js"></script>
  <script type="module" src="./js/logout.js"></script>

  <script src="js/agendamentos.js"></script>
  <script src="js/tableFilters.js"></script>
  <script src="js/leituraVoz.js"></script>
  <script>
    lucide.createIcons();
  </script>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>

    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
</body>
</html>
