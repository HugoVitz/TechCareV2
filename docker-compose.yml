# Ambiente completo do TechCare em contêineres (Docker Desktop no Windows ou Docker no Linux).
#   docker compose up --build              -> banco + API (painel web) + Console do Dono
#   docker compose up -d db                -> só o PostgreSQL (para rodar a API pelo iniciar.bat)
#   docker compose --profile monitoramento up --build   -> + Prometheus e Grafana
# Endereços: http://localhost:5000 (sistema), http://localhost:5100 (Console do Dono),
#            http://localhost:9090 (Prometheus), http://localhost:3000 (Grafana).

name: techcare

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Fuso de Brasília: now() do banco e DateTime.Now da API no mesmo horário local (o padrão dos contêineres é UTC).
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: techcare
      POSTGRES_USER: techcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techcare_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techcare -d techcare"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: techcare-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_ENVIRONMENT: ${AMBIENTE:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=techcare;Username=techcare;Password=${POSTGRES_PASSWORD:-techcare_dev}"
      Jwt__Key: ${JWT_KEY:-dev-only-key-troque-em-producao-0123456789abcdef}
    ports:
      - "5000:8080"

  console:
    build:
      context: .
      dockerfile: admin-mvc/Dockerfile
    image: techcare-console:local
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: America/Sao_Paulo
      ASPNETCORE_ENVIRONMENT: ${AMBIENTE:-Development}
      Api__BaseUrl: "http://api:8080/api/"
    ports:
      - "5100:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["monitoramento"]
    volumes:
      - ./infra/monitoramento/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoramento"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./infra/monitoramento/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
