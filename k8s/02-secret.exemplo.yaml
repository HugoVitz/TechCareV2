# MODELO de Secret. NÃO versione valores reais: crie o Secret no cluster com
#   kubectl -n techcare create secret generic techcare-secrets \
#     --from-literal=ConnectionStrings__DefaultConnection='Host=...;Database=techcare;Username=...;Password=...;SSL Mode=Require' \
#     --from-literal=Jwt__Key="$(openssl rand -base64 48)" \
#     --from-literal=Seed__DonoUser=dono --from-literal=Seed__DonoPassword='senha-forte' \
#     --from-literal=POSTGRES_PASSWORD='senha-do-banco'
# Na Azure, o ideal é guardar estes valores no Key Vault e montá-los com o CSI Secrets Store.
apiVersion: v1
kind: Secret
metadata:
  name: techcare-secrets
  namespace: techcare
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=techcare-db;Port=5432;Database=techcare;Username=techcare;Password=TROQUE-AQUI"
  Jwt__Key: "TROQUE-POR-UMA-CHAVE-ALEATORIA-DE-48-BYTES-EM-BASE64"
  Seed__DonoUser: "dono"
  Seed__DonoPassword: "TROQUE-AQUI"
  POSTGRES_PASSWORD: "TROQUE-AQUI"
