# Segurança de rede: só os pods da API conversam com o banco.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banco-somente-api
  namespace: techcare
spec:
  podSelector:
    matchLabels:
      app: techcare-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: techcare-api
      ports:
        - port: 5432
