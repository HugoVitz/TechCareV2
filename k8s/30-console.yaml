# Console do Dono (MVC). Uma réplica: o login por cookie usa chaves locais do Data Protection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: techcare-console
  namespace: techcare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: techcare-console
  template:
    metadata:
      labels:
        app: techcare-console
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: console
          image: ghcr.io/SEU-USUARIO/techcare-console:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Api__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: techcare-config
                  key: Api__BaseUrl
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: techcare-console
  namespace: techcare
spec:
  selector:
    app: techcare-console
  ports:
    - name: http
      port: 80
      targetPort: http
